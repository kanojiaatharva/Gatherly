services:
  # =====================================================================
  # Backend Web Service (Spring Boot 3 / Java 21 via Multi-stage Docker)
  # =====================================================================
  - type: web
    name: gatherly-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://gatherly-frontend.onrender.com,http://localhost:5173
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # =====================================================================
  # Frontend Static Site (React 18 / TypeScript / Vite SPA)
  # =====================================================================
  - type: web
    name: gatherly-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        value: https://gatherly-backend.onrender.com/api

